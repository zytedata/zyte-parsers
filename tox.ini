[tox]
envlist = py,pre-commit,mypy,docs,twinecheck

[testenv]
deps =
    pytest
    pytest-cov >= 7.0.0
commands =
    pytest \
        --cov-report= --cov-report=xml \
        --cov-report=term-missing --cov=zyte_parsers \
        --doctest-modules \
        {posargs:zyte_parsers tests}

[testenv:pre-commit]
deps =
    pre-commit
commands = pre-commit run --all-files --show-diff-on-failure

[testenv:mypy]
deps =
    mypy==2.3.0
    attrs==26.1.0
    html-text==0.7.1
    price-parser==0.5.1
    pytest==9.1.1
    python-stdnum==2.2
    types-lxml==2026.2.16
commands = mypy {posargs:zyte_parsers tests}

[testenv:docs]
basepython = python3
changedir = docs
deps =
    -rdocs/requirements.txt
commands =
    sphinx-build -W -b html . {envtmpdir}/html

[testenv:twinecheck]
basepython = python3
deps =
    twine==7.0.0
    build==1.5.0
commands =
    python -m build --sdist
    twine check dist/*
